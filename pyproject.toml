[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pravaha-mem"
version = "1.2.1"
description = "Live GPU memory traffic over NVLink C2C on the NVIDIA GB10 (DGX Spark), from the GPU's L2 cache counters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
  {name = "Deepak Panigrahy", email = "deepakp@tamu.edu"},
  {name = "Sirisha Kota"},
]
maintainers = [{name = "Deepak Panigrahy", email = "deepakp@tamu.edu"}]
keywords = ["gb10", "dgx-spark", "nvlink", "nvlink-c2c", "gpu", "memory-traffic", "l2-cache",
            "performance-counters", "cupti", "smmu", "energy", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Hardware",
]
dependencies = []          # standard library only

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/deepakpanigrahy03/pravaha-mem"
Documentation = "https://github.com/deepakpanigrahy03/pravaha-mem/blob/main/docs/MANUAL.md"
Source = "https://github.com/deepakpanigrahy03/pravaha-mem"
Issues = "https://github.com/deepakpanigrahy03/pravaha-mem/issues"
Changelog = "https://github.com/deepakpanigrahy03/pravaha-mem/blob/main/CHANGELOG.md"

[project.scripts]
pravaha = "pravaha_mem.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["pravaha_mem*"]

[tool.setuptools.package-data]
pravaha_mem = ["reader.cpp", "smmu/pravaha_pmcg.c", "pravaha.ini"]

[tool.pytest.ini_options]
markers = ["gpu: needs a GB10 with pravaha installed (light work only)"]
addopts = "-m 'not gpu'"
