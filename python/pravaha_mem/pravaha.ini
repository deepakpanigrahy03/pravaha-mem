; pravaha settings shipped with the library. A file named by $PRAVAHA_CONFIG, then the
; environment, then a function or CLI argument can replace any value for one run.

[thermal]
; Thermal gate of `pravaha verify`. Headroom = degrees the GPU is below its own limit
; (nvidia-smi T.Limit; NVIDIA: 0 = software slowdown, -2 = hardware slowdown, -5 = shutdown).
; Example with a 94 C limit: start_c 10 allows a check up to 84 C; abort_c 5 stops at 89 C.
start_c = 10
abort_c = 5

[verify]
; pravaha verify --kernels. Each run lasts about kernel_seconds of GPU work (the pass count is
; sized from a one pass probe), so it spans many 10 ms samples. The counting window is widened
; by window_pad_ms on each side, as in the copy checks.
kernel_seconds = 2
window_pad_ms = 40
small_mib = 16
; Miss fixture: a buffer far larger than the GPU's L2 read once per pass; every logical byte
; should reach memory, judged within miss_tolerance.
miss_mib = 1024
miss_tolerance = 0.05
