; pravaha settings shipped with the library. A file named by $PRAVAHA_CONFIG, then the
; environment, then a function or CLI argument can replace any value for one run.

[thermal]
; Thermal gate of `pravaha verify`. Headroom = degrees the GPU is below its own limit
; (nvidia-smi T.Limit; NVIDIA: 0 = software slowdown, -2 = hardware slowdown, -5 = shutdown).
; Example with a 94 C limit: start_c 10 allows a check up to 84 C; abort_c 5 stops at 89 C.
start_c = 10
abort_c = 5

[verify]
; pravaha verify --kernels. Each run lasts about kernel_seconds of GPU work (the pass count is
; sized from a one pass probe), so it spans many 10 ms samples. The counting window is widened
; by window_pad_ms on each side, as in the copy checks.
kernel_seconds = 2
window_pad_ms = 40
small_mib = 16
; Miss fixture: a buffer far larger than the GPU's L2 read once per pass; every logical byte
; should reach memory, judged within miss_tolerance.
miss_mib = 1024
miss_tolerance = 0.05

[schedule]
; pravaha verify --schedule. A short probe measures this machine's rates; each task of the
; fixture is then sized to last about slot_seconds, with gap_s of idle between tasks so no
; observation window (widened by [verify] window_pad_ms) catches a neighbouring task.
idle_s = 3
slot_seconds = 2
gap_s = 1
; streaming read: footprint far larger than the 24 MiB GPU L2, every logical byte reaches memory
; (judged with [verify] miss_tolerance)
streaming_mib = 1024
; resident read: footprint inside L2; the cache serves the reads after the first pass
resident_mib = 8
resident_max_ratio = 0.05
; sham: paced empty kernels; memory bytes per second above the idle background
sham_pace_ms = 10
sham_max_bytes_per_s = 100000000
; copy: pinned host to device; observed copy bytes per payload byte
copy_mib = 256
copy_tolerance = 0.05
; square wave: half durations against period / 2
square_period_s = 2
square_periods = 4
square_pace_ms = 50
half_tolerance = 0.05
